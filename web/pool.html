<style>
:root { --bg: #f6f3ec; --panel: #fffdf8; --ink: #1d1b17; --ink2: #4a453d; --muted: #7a7366; --line: #e7e0d2; --accent: #e0482a; --soft: #fbe6df; --bad: #b42318; }

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
.card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
.brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-block; }
h1 { font-size: 19px; margin: 0 0 4px; word-break: break-all; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 14px 0 8px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 46px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; text-decoration: none; margin-top: 12px; cursor: pointer; }
.btn.line { background: var(--soft); color: var(--accent); }
.bad { color: var(--bad); }
.note { color: var(--muted); font-size: 12.5px; margin-top: 16px; line-height: 1.6; }
textarea.txt { width: 100%; min-height: 180px; max-height: 50vh; margin-top: 4px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit; font-size: 15px; line-height: 1.6; resize: vertical; }
img.pre { max-width: 100%; border-radius: 10px; margin-top: 12px; display: block; }

'use strict';
// 文件格式：IV(16) + AES-256-CBC 密文 + HMAC-SHA256(16+密文)；Enc/Mac 两把钥匙由文件密钥 HMAC 派生（和轻桥电脑之间发文件一样）。
// 明文：4 字节文件名长度（小端）+ 文件名（UTF-8）+ 文件内容。密钥在网址 # 后面，不会发给服务器。
const $ = id => document.getElementById(id);
const fmt = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
function fail(msg) { $('title').textContent = '下载不了'; $('sub').innerHTML = '<span class="bad"></span>'; $('sub').firstChild.textContent = msg; $('barw').style.display = 'none'; }

// ───── SHA-256 / HMAC（纯 JS，http 页面里浏览器不给 WebCrypto） ─────
const K256 = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

Sha256.prototype.block = function (b, o) {

  for (let i = 0; i < 16; i++) w[i] = b[o + 4 * i] << 24 | b[o + 4 * i + 1] << 16 | b[o + 4 * i + 2] << 8 | b[o + 4 * i + 3];
  for (let i = 16; i < 64; i++) { const x = w[i - 15], y = w[i - 2]; w[i] = (((x >>> 7 | x << 25) ^ (x >>> 18 | x << 14) ^ x >>> 3) + w[i - 7] + ((y >>> 17 | y << 15) ^ (y >>> 19 | y << 13) ^ y >>> 10) + w[i - 16]) | 0; }
  let a = h[0], b2 = h[1], c = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
  for (let i = 0; i < 64; i++) {
    const t1 = (hh + ((e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7)) + (e & f ^ ~e & g) + K256[i] + w[i]) | 0;
    const t2 = (((a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10)) + (a & b2 ^ a & c ^ b2 & c)) | 0;

  }
  h[0] += a; h[1] += b2; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += hh;

const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', heic: 'image/heic', pdf: 'application/pdf', txt: 'text/plain;charset=utf-8', mp4: 'video/mp4', mov: 'video/quicktime', mp3: 'audio/mpeg' };
async function main() {
  const id = location.pathname.split('/').pop(), key = location.hash.slice(1);
  if (!/^[0-9a-f]{32}$/.test(id) || key.length < 40) return fail('链接不完整：要把整个链接复制过来（包括 # 后面的部分）。');
  const fileKey = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - key.length % 4) % 4)), c => c.charCodeAt(0));
  let data;
  try {
    const r = await fetch('../f/' + id, { cache: 'no-store' });
    if (r.status === 404) return fail('这个文件已经不在小云上了（放进来 3 天后会自动删除）。');
    if (!r.ok) return fail('服务器返回 ' + r.status + '，请稍后再试。');
    const total = +r.headers.get('content-length') || 0;
    data = new Uint8Array(total); let got = 0; const rd = r.body.getReader();
    for (;;) { const { done, value } = await rd.read(); if (done) break; if (got + value.length > data.length) { const n = new Uint8Array(Math.max(data.length * 2, got + value.length)); n.set(data.subarray(0, got)); data = n; } data.set(value, got); got += value.length; $('bar').style.width = total ? (got * 100 / total).toFixed(1) + '%' : '50%'; $('sub').textContent = '正在下载 ' + fmt(got) + (total ? ' / ' + fmt(total) : ''); }
    data = data.subarray(0, got);
  } catch (e) { return fail('网络断了，请重试。'); }
  let plain;
  try { plain = await openSealed(fileKey, data, t => { $('sub').textContent = t; }); } catch (e) { return fail(e.message); }
  const n = plain[0] | plain[1] << 8 | plain[2] << 16 | plain[3] << 24;
  if (n < 0 || n > 4096 || 4 + n > plain.length) return fail('文件格式不对');
  const name = new TextDecoder().decode(plain.subarray(4, 4 + n)).replace(/[\\/]/g, '_') || '文件';
  const body = plain.subarray(4 + n), ext = (name.split('.').pop() || '').toLowerCase();
  const url = URL.createObjectURL(new Blob([body], { type: MIME[ext] || 'application/octet-stream' }));
  $('title').textContent = name; $('sub').textContent = fmt(body.length) + ' · 已解密'; $('barw').style.display = 'none';
  const a = document.createElement('a'); a.className = 'btn'; a.href = url; a.download = name; a.textContent = '保存到这台设备';
  $('act').appendChild(a);
  if (MIME[ext]) { const v = document.createElement('a'); v.className = 'btn line'; v.href = url; v.target = '_blank'; v.rel = 'noopener'; v.textContent = '直接打开'; $('act').appendChild(v); }
  if (ext === 'txt' && body.length < (2 << 20)) {
    // 存在小云里的文字：直接显示，可以复制
    const text = new TextDecoder().decode(body).replace(/^﻿/, '').replace(/\r\n/g, '\n');
    $('title').textContent = '小云里的文字'; $('sub').textContent = text.length + ' 字 · 已解密';
    const ta = document.createElement('textarea'); ta.className = 'txt'; ta.readOnly = true; ta.value = text;
    const c = document.createElement('button'); c.className = 'btn'; c.textContent = '复制文字';
    c.onclick = () => { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); let ok = false; try { ok = document.execCommand('copy'); } catch { } if (!ok && navigator.clipboard) navigator.clipboard.writeText(text).then(() => c.textContent = '已复制', () => {}); c.textContent = ok ? '已复制' : '长按上面的文字复制'; };
    $('act').innerHTML = ''; $('act').append(ta, c);
    a.className = 'btn line'; a.textContent = '存成 .txt 文件'; $('act').appendChild(a);
    return;
  }
  if (/^image\//.test(MIME[ext] || '') && ext !== 'heic') { const img = new Image(); img.className = 'pre'; img.src = url; img.alt = ''; $('act').appendChild(img); }
}
