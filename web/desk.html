<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismBlue 轻桥</title>
<link rel="icon" href="/assets/icon.svg">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/desk.css">
</head>
<body>
<div class="app">
<aside class="rail">
  <div class="rbrand"><img class="logo" src="/assets/icon.svg" alt=""><b><small>PrismBlue</small>轻桥</b></div>
  <nav class="rnav" id="dtabs">
    <button class="ritem" data-page="home" id="navHome"></button>
    <button class="ritem" data-page="feed" id="navFeed"></button>
    <button class="ritem" data-open-cloud id="navCloud"></button>
  </nav>
  <div class="rsep"></div>
  <button class="ritem" id="openSettings"></button>
  <div class="grow"></div>
  <div class="rfoot" id="rfoot"></div>
</aside>
<div class="pane">
<header class="top">
  <div class="ph">
    <h1 id="pageTitle">主页</h1>
    <p id="pageSub"></p>
    <div class="pstrip">
      <button class="me" id="me" title="点一下改名字"><span class="me-label">本机</span><b id="meName">…</b></button>
      <button class="sync" id="sync"></button>
      <span class="pinfo" id="pinfo"></span>
    </div>
  </div>
</header>
<main id="main">
  <section id="requests"></section>
  <section id="pending"></section>
  <section id="welcome" class="hide"></section>
  <section id="devicesWrap">
    <div class="sec-head"><h2>我的设备</h2><span class="hint" id="devHint">把文件拖到设备上就能发过去</span><div class="grow"></div><button class="btn ghost small addbtn" data-add id="addBtn"></button></div>
    <div class="devices" id="devices"></div>
  </section>
  <section id="nearbyWrap" class="hide">
    <div class="sec-head"><h2>附近的电脑</h2><span class="hint">也开着轻桥，点“连接”后在那台电脑点“允许”</span></div>
    <div class="nearby" id="nearby"></div>
  </section>
  <section id="recentWrap" class="hide"></section>
  <section id="feedWrap">
    <div class="sec-head"><h2>动态</h2><span class="hint" id="feedHint"></span><div class="grow"></div><button class="btn ghost small hide" id="histBtn" data-open-history="">手机发来的内容</button><button class="btn ghost small" id="clearFeed">清空</button></div>
    <div class="fsplit"><ol class="feed" id="feed"></ol><aside class="fdetail" id="fdetail"></aside></div>
  </section>
</main>
</div>
</div>

<div class="scrim hide" id="scrim"></div>
<aside class="drawer" id="settings" aria-hidden="true"></aside>
<div class="modal hide" id="addModal"></div>
<div class="dropzone hide" id="dropzone"><div class="dz-title">松开，发到…</div><div class="dz-grid" id="dzGrid"></div></div>
<div class="hist hide" id="history"></div>
<div class="hist hide" id="cloud"></div>
<div class="toast" id="toast"></div>
<script src="/assets/icons.js"></script>
<script src="/assets/desk.js"></script>
</body>
</html>
